<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Saurabh Mobile Hub in Digras, Maharashtra. Genuine Phones. Honest Prices. Explore smartphones and accessories, and confirm prices and availability with the shop." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saurabh Mobile Hub" />
    <meta property="og:title" content="Home | Saurabh Mobile Hub" />
    <meta property="og:description" content="Saurabh Mobile Hub in Digras, Maharashtra. Genuine Phones. Honest Prices. Explore smartphones and accessories, and confirm prices and availability with the shop." />
    <meta property="og:locale" content="en_IN" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Home | Saurabh Mobile Hub</title>
    <style>
      .brand-boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font: 14px Arial, sans-serif; color: #111111; background: #ffffff; }
      .brand-boot svg { width: 56px; height: 56px; animation: boot-pulse 1.5s ease-in-out infinite; }
      .brand-boot button { min-height: 44px; padding: 10px 24px; border: 1px solid #C79100; border-radius: 24px; background: #C79100; color: #111111; font: inherit; cursor: pointer; }
      .brand-boot [hidden] { display: none; }
      @keyframes boot-pulse { 50% { opacity: .6; transform: scale(.96); } }
      @media (prefers-reduced-motion: reduce) { .brand-boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="brand-boot" class="brand-boot" role="status">
        <svg width="56" height="56" viewBox="0 0 40 40" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#C79100" />
          <rect x="13" y="8" width="14" height="24" rx="2.5" stroke="#111111" stroke-width="2" />
          <path d="M18 11h4" stroke="#111111" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="20" cy="28" r="1" fill="#111111" />
        </svg>
        <span>Loading Saurabh Mobile Hub…</span>
        <button id="boot-reload" type="button" hidden>Reload</button>
      </div>
    </div>
    <script>
      (() => {
        const root = document.getElementById("root");
        const reload = document.getElementById("boot-reload");
        if (!root || !reload) return;
        reload.addEventListener("click", () => window.location.reload());
        const timer = setTimeout(() => { reload.hidden = false; }, 8000);
        const observer = new MutationObserver(() => {
          if (!document.getElementById("brand-boot")) {
            clearTimeout(timer);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <noscript>This shop preview needs JavaScript to display its catalog.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
